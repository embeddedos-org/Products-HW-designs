name: eradar360
description: 360° driver awareness radar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
  # Desktop platforms
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Desktop platforms
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
